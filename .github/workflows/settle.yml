name: Match Settlement Service

on:
  schedule:
    # Runs every 15 minutes (DB-only — no external API calls)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to still run it manually if needed

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Settlement Engine
        run: node scripts/settle.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}