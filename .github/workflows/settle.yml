name: Match Settlement Service

on:
  schedule:
    # Runs every 5 minutes (standard for live-score apps)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to still run it manually if needed

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Settlement Engine
        run: node scripts/settle.js
        env:
          # These MUST match the keys in your GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}